# Local development: frontend + backend + MySQL.
# Run:  cp .env.example .env   (then edit the passwords)   and   docker compose up --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dragonwok}
      MYSQL_USER: ${DB_USER:-dragonwok}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql          # data survives restarts
    ports:
      - "127.0.0.1:3307:3306"              # local machine only, never public
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend_net]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db                          # internal Docker network name
      DB_PORT: 3306
      DB_SSL_CA: ""                        # no TLS inside the local Docker network
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [backend_net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:80"
    networks: [backend_net]

volumes:
  mysql_data:

networks:
  backend_net:
